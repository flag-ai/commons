[tool.poetry]
name = "flag-commons"
version = "0.3.0"
description = "Shared Python library for the FLAG (Foundation for Local AI Governance) platform"
authors = ["Kirizan"]
license = "Apache-2.0"
readme = "README.md"
packages = [{include = "flag_commons", from = "src"}]
include = ["src/flag_commons/py.typed"]

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.0"
httpx = ">=0.27"
typing-extensions = ">=4.6"
sqlalchemy = {version = "^2.0", extras = ["asyncio"], optional = true}
psycopg = {version = "^3.1", extras = ["binary"], optional = true}
alembic = {version = "^1.13", optional = true}
fastapi = {version = ">=0.115", optional = true}

[tool.poetry.extras]
postgres = ["sqlalchemy", "psycopg", "alembic"]
fastapi = ["fastapi"]
all = ["sqlalchemy", "psycopg", "alembic", "fastapi"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^6.0"
pytest-mock = "^3.12"
pytest-timeout = "^2.4.0"
anyio = ">=4.0"
respx = ">=0.21"
ruff = ">=0.8"
mypy = "^1.10"
bandit = ">=1.7"
pip-audit = ">=2.7"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 30
markers = ["integration: needs a live PostgreSQL (TEST_DATABASE_URL)"]

[tool.coverage.run]
source = ["flag_commons"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
ignore_missing_imports = true
files = ["src/flag_commons"]

[tool.bandit]
exclude_dirs = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
